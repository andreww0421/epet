name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 19 * * 1'
  workflow_dispatch:

# Jobs must opt in to only the token scopes they need.
permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze JavaScript and TypeScript
        id: codeql_analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:javascript-typescript

      - name: Explain CodeQL failure
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "::error title=CodeQL analysis failed::Review the CodeQL step above for an extraction, query, or upload error. No production credentials are used by this workflow."
          echo "If the analysis completed, review the repository's Code scanning alerts for findings."

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        id: dependency_review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: never

      - name: Explain dependency review failure
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "::error title=Unsafe dependency change detected::The pull request introduces a dependency with a high or critical advisory, or dependency review could not complete."
          echo "Inspect the Dependency review summary above and update or remove the affected dependency before merging."

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Audit committed dependency lockfile
        id: npm_audit
        run: npm audit --audit-level=high

      - name: Explain npm audit failure
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "::error title=npm audit did not pass::npm audit found at least one high or critical vulnerability in the committed dependency graph, or the audit service could not complete."
          echo "Run 'npm audit --audit-level=high' locally, review the advisory paths above, and prefer a tested non-breaking upgrade. Do not apply '--force' without reviewing its impact."
